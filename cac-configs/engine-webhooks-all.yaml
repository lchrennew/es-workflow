---
kind: target-request
name: engine-run-started
metadata:
  title: Engine run.started 目标请求
spec:
  props:
    trigger: engine-run-started-trigger
    binding: engine-webhook-binding
    template: engine-run-started-template
    targetSystem: engine-webhook-api
  errorTracking:
    enabled: true
    eventName: engine-webhook-forward-failed
  postResponseScript: |
    console.log('run.started webhook forwarded:', response?.status);
    if (!response?.ok) {
      console.error('Forward failed:', response?.statusText);
    }

