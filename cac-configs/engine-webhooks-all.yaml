---
kind: target-system
name: engine-webhook-api
metadata:
  title: Engine Webhook API 服务
spec:
  default: http://localhost:3000/api/engine/webhooks
  development: http://localhost:3000/api/engine/webhooks
  staging: https://api-staging.example.com/api/engine/webhooks
  production: https://api.example.com/api/engine/webhooks

---
kind: binding
name: engine-webhook-binding
metadata:
  title: Engine Webhook 数据绑定
spec:
  script: |
    variables.EVENT_TYPE = headers['x-webhook-event'] || 'unknown';
    variables.RUN_ID = body.run?.id || body.runId || '';
    variables.TASK_ID = body.taskId || '';
    variables.REQUEST_ID = body.requestId || body.request?.id || '';
    variables.WORKFLOW_ID = body.run?.workflowId || '';
    variables.WORKFLOW_NAME = body.run?.workflowName || '';
    variables.RUN_STATUS = body.run?.status || '';
    variables.TASK_STATUS = body.task?.status || '';
    variables.TIMESTAMP = dayjs().unix();
    
    variables.RUN = JSON.stringify(body.run || {});
    variables.TASK = JSON.stringify(body.task || {});
    variables.REQUEST = JSON.stringify(body.request || {});
    variables.EMITTER = JSON.stringify(body.emitter || {});
    variables.EMITTER_RULE = JSON.stringify(body.emitterRule || {});
    variables.EVENT = JSON.stringify(body.event || {});
    variables.PAYLOAD = JSON.stringify(body.payload || {});
    
    variables['@'] = query.env || 'production';

---
kind: source-interceptor
name: engine-webhook-filter
metadata:
  title: Engine Webhook 过滤器
spec:
  script: |
    if (method !== 'POST') {
      console.log('Only POST requests allowed');
      return true;
    }
    
    if (!headers['x-webhook-event']) {
      console.log('Missing webhook event header');
      return true;
    }
    
    const allowedEvents = [
      'run.started',
      'run.completed',
      'task.started',
      'task.completed',
      'request.sent',
      'response.received',
      'task.updated'
    ];
    
    if (!allowedEvents.includes(headers['x-webhook-event'])) {
      console.log(`Event ${headers['x-webhook-event']} not allowed`);
      return true;
    }
    
    return false;

---
kind: target-interceptor
name: never-intercept
metadata:
  title: 从不拦截
spec:
  script: |
    return false;

---
kind: template
name: engine-run-started-template
metadata:
  title: Engine run.started 事件模板
spec:
  path: /run-started
  method: POST
  format: json
  headers:
    Content-Type: application/json
    X-Webhook-Event: run.started
    X-Run-ID: $RUN_ID$
  body:
    eventType: run.started
    runId: $RUN_ID$
    workflowId: $WORKFLOW_ID$
    workflowName: $WORKFLOW_NAME$
    status: $RUN_STATUS$
    timestamp: $(Number)TIMESTAMP$
    run: $...RUN$

