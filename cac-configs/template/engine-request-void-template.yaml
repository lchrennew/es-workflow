kind: template
name: engine-request-void-template
metadata:
  title: Engine request.void 事件模板
spec:
  path: /request-void
  method: POST
  format: json
  headers:
    Content-Type: application/json
    X-Webhook-Event: request.void
    X-Run-ID: $RUN_ID$
    X-Task-ID: $TASK_ID$
    X-Request-ID: $REQUEST_ID$
  body:
    eventType: request.void
    runId: $RUN_ID$
    taskId: $TASK_ID$
    requestId: $REQUEST_ID$
    workflowId: $WORKFLOW_ID$
    timestamp: $(Number)TIMESTAMP$
    action: $ACTION$
    reason: $REASON$
    run: $...RUN$
    task: $...TASK$
    request: $...REQUEST$
