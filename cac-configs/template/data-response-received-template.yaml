kind: template
name: data-response-received-template
metadata:
  title: Data response.received 事件模板
spec:
  path: /response-received
  method: POST
  format: json
  headers:
    Content-Type: application/json
  body:
    eventType: response.received
    runId: $RUN_ID$
    taskId: $TASK_ID$
    requestId: $REQUEST_ID$
    workflowId: $WORKFLOW_ID$
    timestamp: $(Number)TIMESTAMP$
    run: $...RUN$
    response: $...RESPONSE$
