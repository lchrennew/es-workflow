kind: template
name: engine-response-received-template
metadata:
  title: Engine response.received 事件模板
spec:
  path: /response-received
  method: POST
  format: json
  headers:
    Content-Type: application/json
    X-Webhook-Event: response.received
    X-Run-ID: $RUN_ID$
    X-Task-ID: $TASK_ID$
    X-Request-ID: $REQUEST_ID$
  body:
    eventType: response.received
    runId: $RUN_ID$
    taskId: $TASK_ID$
    requestId: $REQUEST_ID$
    workflowId: $WORKFLOW_ID$
    timestamp: $(Number)TIMESTAMP$
    run: $...RUN$
    response: $...RESPONSE$
