kind: template
name: engine-run-completed-template
metadata:
  title: Engine run.completed 事件模板
spec:
  path: /run-completed
  method: POST
  format: json
  headers:
    Content-Type: application/json
    X-Webhook-Event: run.completed
    X-Run-ID: $RUN_ID$
  body:
    eventType: run.completed
    runId: $RUN_ID$
    workflowId: $WORKFLOW_ID$
    workflowName: $WORKFLOW_NAME$
    status: $RUN_STATUS$
    timestamp: $(Number)TIMESTAMP$
    run: $...RUN$
