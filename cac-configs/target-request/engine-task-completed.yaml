kind: target-request
name: engine-task-completed
metadata:
  title: Engine task.completed 目标请求
spec:
  props:
    trigger: engine-task-completed-trigger
    binding: engine-webhook-binding
    template: engine-task-completed-template
    targetSystem: engine-webhook-api
  errorTracking:
    enabled: true
    eventName: engine-webhook-forward-failed
  postResponseScript: |
    console.log('task.completed webhook forwarded:', response?.status);
    if (!response?.ok) {
      console.error('Forward failed:', response?.statusText);
    }
