kind: target-request
name: engine-request-void
metadata:
  title: Engine request.void 目标请求
spec:
  props:
    trigger: engine-request-void-trigger
    binding: engine-webhook-binding
    template: engine-request-void-template
    targetSystem: engine-webhook-api
  errorTracking:
    enabled: true
    eventName: engine-webhook-forward-failed
  postResponseScript: |
    console.log('request.void webhook forwarded:', response?.status);
    if (!response?.ok) {
      console.error('Forward failed:', response?.statusText);
    }
