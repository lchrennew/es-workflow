kind: target-request
name: data-response-received
metadata:
  title: Data response.received 目标请求
spec:
  props:
    trigger: data-response-received-trigger
    binding: data-webhook-binding
    template: data-response-received-template
    targetSystem: data-webhook-api
  errorTracking:
    enabled: true
    eventName: data-webhook-forward-failed
  postResponseScript: |
    console.log('response.received forwarded to Data service:', response?.status);
    if (!response?.ok) {
      console.error('Forward to Data failed:', response?.statusText);
    }
