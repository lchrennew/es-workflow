# Adaptor 完整配置示例

这是一个用户仪表盘数据聚合的完整示例,展示了如何使用 Adaptor 从多个微服务聚合数据并返回给前端。

## 场景说明

前端需要展示用户仪表盘,包含:
- 用户基本信息 (来自用户服务)
- 最近订单列表 (来自订单服务)
- 未读通知数量 (来自通知服务)

使用 Adaptor 可以在一次请求中聚合所有数据,减少前端请求次数。

## 访问方式

```
GET /adapt/user-dashboard?userId=12345
Authorization: Bearer <token>
```

## 配置文件

### 1. TargetSystem - 定义各个微服务地址

```yaml
---
kind: target-system
name: user-service
metadata:
  title: 用户服务
spec:
  default: https://user-api.example.com
  production: https://user-api.prod.example.com
  staging: https://user-api.staging.example.com

---
kind: target-system
name: order-service
metadata:
  title: 订单服务
spec:
  default: https://order-api.example.com
  production: https://order-api.prod.example.com

---
kind: target-system
name: notification-service
metadata:
  title: 通知服务
spec:
  default: https://notification-api.example.com
  production: https://notification-api.prod.example.com
```

### 2. Binding - 提取请求参数

```yaml
---
kind: binding
name: extract-user-params
metadata:
  title: 提取用户参数
spec:
  script: |
    variables.USER_ID = query.userId || body.userId;
    variables.TOKEN = headers.authorization?.replace('Bearer ', '');
    variables.LIMIT = String(query.limit || 10);
```

### 3. Template - 定义各个请求格式

```yaml
---
kind: template
name: user-profile-template
metadata:
  title: 用户资料请求模板
spec:
  path: /api/v1/users/$USER_ID$
  method: GET
  headers:
    Authorization: Bearer $TOKEN$

---
kind: template
name: user-orders-template
metadata:
  title: 用户订单请求模板
spec:
  path: /api/v1/orders
  method: GET
  headers:
    Authorization: Bearer $TOKEN$
  query:
    userId: $USER_ID$
    limit: $LIMIT$
    status: active

---
kind: template
name: user-notifications-template
metadata:
  title: 用户通知请求模板
spec:
  path: /api/v1/notifications/unread-count
  method: GET
  headers:
    Authorization: Bearer $TOKEN$
  query:
    userId: $USER_ID$
```

### 4. SourceInterceptor - 验证请求

```yaml
---
kind: source-interceptor
name: auth-check
metadata:
  title: 权限验证
spec:
  script: |
    if (!headers.authorization) {
      console.log('Missing authorization header');
      return true;
    }
    
    if (!query.userId && !body.userId) {
      console.log('Missing userId parameter');
      return true;
    }
    
    return false;
```

### 5. AdaptorRequest - 定义各个数据请求

```yaml
---
kind: adaptor-request
name: user-profile
metadata:
  title: 获取用户资料
spec:
  binding: extract-user-params
  template: user-profile-template
  targetSystem: user-service

---
kind: adaptor-request
name: user-orders
metadata:
  title: 获取用户订单
spec:
  binding: extract-user-params
  template: user-orders-template
  targetSystem: order-service

---
kind: adaptor-request
name: user-notifications
metadata:
  title: 获取未读通知数
spec:
  binding: extract-user-params
  template: user-notifications-template
  targetSystem: notification-service
```

### 6. Adaptor - 聚合数据并返回

```yaml
---
kind: adaptor
name: user-dashboard
metadata:
  title: 用户仪表盘数据聚合
spec:
  sourceInterceptor: auth-check
  adaptorRequests:
    - user-profile
    - user-orders
    - user-notifications
  transformResponse: |
    const profile = responses['user-profile']?.data;
    const orders = responses['user-orders']?.items || [];
    const notifications = responses['user-notifications']?.data;
    
    if (!profile) {
      result.error = 'Failed to fetch user profile';
      return;
    }
    
    result.dashboard = {
      user: {
        id: profile.id,
        name: profile.name,
        email: profile.email,
        avatar: profile.avatar,
        memberLevel: profile.memberLevel
      },
      stats: {
        totalOrders: orders.length,
        unreadNotifications: notifications?.count || 0,
        lastLoginTime: profile.lastLoginTime
      },
      recentOrders: orders.slice(0, 5).map(order => ({
        id: order.id,
        title: order.title,
        amount: order.amount,
        status: order.status,
        createdAt: order.createdAt
      })),
      timestamp: Date.now()
    };
  outputCache:
    enabled: true
    keyGetter: |
      return `dashboard:${query.userId}`;
    expirationSeconds: 60
  passive: false
```

