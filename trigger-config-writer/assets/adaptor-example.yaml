## 被动模式示例

如果需要根据用户等级按需加载不同数据,可以使用被动模式:

```yaml
kind: adaptor
name: user-dashboard-passive
metadata:
  title: 用户仪表盘数据聚合(被动模式)
spec:
  sourceInterceptor: auth-check
  adaptorRequests:
    - user-profile
    - user-orders
    - premium-benefits
  transformResponse: |
    const profile = await requests['user-profile'].response;
    
    if (!profile?.data) {
      result.error = 'Failed to fetch user profile';
      return;
    }
    
    result.user = profile.data;
    
    const orders = await requests['user-orders'].response;
    result.recentOrders = orders?.items?.slice(0, 5) || [];
    
    if (profile.data.memberLevel === 'premium') {
      const benefits = await requests['premium-benefits'].response;
      result.premiumBenefits = benefits?.data;
    }
    
    result.timestamp = Date.now();
  outputCache:
    enabled: true
    keyGetter: |
      return `dashboard:${query.userId}:${method}`;
    expirationSeconds: 60
  passive: true
```

## 使用场景

1. **BFF 层**: 作为前端的后端聚合层
2. **API 网关**: 聚合多个微服务的数据
3. **数据转换**: 将后端数据格式转换为前端需要的格式
4. **性能优化**: 减少前端请求次数,提升加载速度
5. **缓存层**: 为慢速 API 添加缓存,提升响应速度

## 与 Trigger 的对比

| 特性 | Trigger | Adaptor |
|------|---------|---------|
| 路由 | `/hook/:name` | `/adapt/:name` |
| 返回值 | `{ok, eventID}` | 自定义数据结构 |
| 用途 | 请求转发 | 数据聚合 |
| 缓存 | 不支持 | 支持输出缓存 |
| 被动模式 | 不支持 | 支持按需加载 |

## 注意事项

1. **错误处理**: transformResponse 中需要检查响应是否存在
2. **缓存策略**: 根据数据更新频率设置合理的缓存时间
3. **性能考虑**: 被动模式适合条件加载,非被动模式适合并行请求
4. **权限验证**: 使用 sourceInterceptor 进行统一的权限验证
5. **数据脱敏**: 在 transformResponse 中过滤敏感信息
